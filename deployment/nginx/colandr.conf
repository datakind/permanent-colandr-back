# Colandr Production Nginx Configuration
#
# Installation:
#   sudo ln -sf ~/permanent-colandr-back/deployment/nginx/colandr.conf /etc/nginx/conf.d/colandr.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Updates:
#   git pull
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL Setup:
#   See docs/production-deployment.md for certbot instructions

upstream colandr_api {
    server localhost:5000;
    keepalive 32;
}

upstream colandr_frontend {
    server localhost:9000;
    keepalive 32;
}

# HTTP server - redirect to HTTPS (after SSL is configured)
server {
    server_name *.colandrapp.com colandrapp.com localhost;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS (uncomment after SSL is set up)
    # After running certbot, it will automatically add this redirect
    # return 301 https://$server_name$request_uri;

    client_max_body_size 50M;

    # API routes, docs, and OpenAPI spec - proxy to backend (must use regex to match before / location)
    location ~ ^/(api|docs|openapi\.json) {
        proxy_pass http://colandr_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Critical: Set proper headers for Flask to detect HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Follow redirects (backend redirects /api/health to /api/health/)
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend - all requests go through PHP-FPM (Laravel handles routing and static files)
    location / {
        fastcgi_pass colandr_frontend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param X-Real-IP $remote_addr;
        fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        fastcgi_param X-Forwarded-Proto $scheme;
        fastcgi_param X-Forwarded-Host $host;
        fastcgi_param X-Forwarded-Port $server_port;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.colandrapp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.colandrapp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# HTTPS server block
# Certbot will automatically add this block when you run: sudo certbot --nginx -d v2.colandrapp.com
# The HTTPS block will have the same routing as the HTTP block above

server {
    if ($host = api.colandrapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = v2.colandrapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name *.colandrapp.com colandrapp.com localhost;
    return 404; # managed by Certbot




}
